name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit:
    name: Documentation Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # Full history: the VERSION_MANIFEST gate derives per-file dates from
          # `git log` — a depth-1 clone collapses every date to the checkout
          # commit and makes the gate fail on any manifest generated elsewhere.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # package.json lives at the repository root, not under scripts/.
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun scripts/audit.ts

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # The action requires a GITLEAKS_LICENSE for private repositories and needs
      # pull-requests:read to annotate PRs — neither is warranted here, since all
      # this job needs is a pass/fail scan. Config comes from .gitleaks.toml.
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --config=/github/workspace/.gitleaks.toml --redact --verbose --no-banner

  application:
    name: Application Validation
    runs-on: ubuntu-latest
    env:
      # Synthetic values exercise parsing and startup without granting CI
      # access to GitHub OAuth, Coolify, or production data.
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_GITHUB_ID: ci-github-client
      AUTH_GITHUB_SECRET: ci-github-secret
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      BOOTSTRAP_GITHUB_LOGIN: JJiseong
      DATABASE_URL: file:/tmp/deploy-svc-ci.db
      APP_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ALLOWED_GITHUB_OWNERS: JJiseong
      COOLIFY_BASE_URL: https://coolify.example.test
      COOLIFY_READ_API_TOKEN: test
      COOLIFY_WRITE_API_TOKEN: test
      COOLIFY_DEPLOY_API_TOKEN: test
      COOLIFY_PROJECT_UUID: ci-project
      COOLIFY_SERVER_UUID: ci-server
      COOLIFY_GITHUB_APP_UUID: ci-github-app
      COOLIFY_ENVIRONMENT_NAME: ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Assert Coolify credentials stay server-only
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i 'COOLIFY_(READ|WRITE|DEPLOY)_API_TOKEN|Authorization[[:space:]]*:[[:space:]]*["'"'"']Bearer|Bearer[[:space:]]+(test|read-token|write-token|deploy-token)' .next/static; then
            echo 'Coolify credential material was found in a browser bundle.' >&2
            exit 1
          fi

      - name: Migrate and smoke test standalone server
        shell: bash
        run: |
          set -euo pipefail
          bun run db:migrate
          AUTH_URL=https://portal.ci.example.test bun run staging:preflight -- --skip-coolify
          node .next/standalone/server.js > /tmp/deploy-svc-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          health_file=/tmp/deploy-svc-health.json
          ready_file=/tmp/deploy-svc-ready.json
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live > "$health_file"; then
              break
            fi
            sleep 1
          done
          test -s "$health_file"
          grep -q '"status":"ok"' "$health_file"
          curl --fail --silent http://127.0.0.1:3000/api/health/ready > "$ready_file"
          grep -q '"status":"ready"' "$ready_file"

          ROUTE_SMOKE_ALLOW_MUTATION=true ROUTE_SMOKE_RUN_A11Y=true ROUTE_SMOKE_BASE_URL=http://127.0.0.1:3000 bun run test:routes

          A11Y_BASE_URL=http://127.0.0.1:3000 bun run test:a11y -- \
            http://127.0.0.1:3000/login \
            'http://127.0.0.1:3000/login?error=AccessDenied'

          echo '--- standalone server log ---'
          cat /tmp/deploy-svc-server.log

  container:
    name: Container Image Smoke
    needs: application
    runs-on: ubuntu-latest
    env:
      # Synthetic values exercise container startup without granting CI any
      # GitHub OAuth, Coolify, or production credentials.
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_GITHUB_ID: ci-github-client
      AUTH_GITHUB_SECRET: ci-github-secret
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      BOOTSTRAP_GITHUB_LOGIN: JJiseong
      DATABASE_URL: file:/data/portal.db
      APP_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ALLOWED_GITHUB_OWNERS: JJiseong
      COOLIFY_BASE_URL: https://coolify.example.test
      COOLIFY_READ_API_TOKEN: test
      COOLIFY_WRITE_API_TOKEN: test
      COOLIFY_DEPLOY_API_TOKEN: test
      COOLIFY_PROJECT_UUID: ci-project
      COOLIFY_SERVER_UUID: ci-server
      COOLIFY_GITHUB_APP_UUID: ci-github-app
      COOLIFY_ENVIRONMENT_NAME: ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build container image
        run: docker build --tag deploy-svc:ci .

      - name: Start container and verify persistent volume
        shell: bash
        run: |
          set -euo pipefail
          volume_name=deploy-svc-ci-data
          env_file=/tmp/deploy-svc-container.env
          container_name=deploy-svc-ci
          docker volume create "$volume_name" >/dev/null
          printf '%s\n' \
            "AUTH_SECRET=$AUTH_SECRET" \
            "AUTH_GITHUB_ID=$AUTH_GITHUB_ID" \
            "AUTH_GITHUB_SECRET=$AUTH_GITHUB_SECRET" \
            "AUTH_URL=$AUTH_URL" \
            "AUTH_TRUST_HOST=$AUTH_TRUST_HOST" \
            "BOOTSTRAP_GITHUB_LOGIN=$BOOTSTRAP_GITHUB_LOGIN" \
            "DATABASE_URL=$DATABASE_URL" \
            "APP_ENCRYPTION_KEY=$APP_ENCRYPTION_KEY" \
            "ALLOWED_GITHUB_OWNERS=$ALLOWED_GITHUB_OWNERS" \
            "COOLIFY_BASE_URL=$COOLIFY_BASE_URL" \
            "COOLIFY_READ_API_TOKEN=$COOLIFY_READ_API_TOKEN" \
            "COOLIFY_WRITE_API_TOKEN=$COOLIFY_WRITE_API_TOKEN" \
            "COOLIFY_DEPLOY_API_TOKEN=$COOLIFY_DEPLOY_API_TOKEN" \
            "COOLIFY_PROJECT_UUID=$COOLIFY_PROJECT_UUID" \
            "COOLIFY_SERVER_UUID=$COOLIFY_SERVER_UUID" \
            "COOLIFY_GITHUB_APP_UUID=$COOLIFY_GITHUB_APP_UUID" \
            "COOLIFY_ENVIRONMENT_NAME=$COOLIFY_ENVIRONMENT_NAME" \
            "NEXT_TELEMETRY_DISABLED=$NEXT_TELEMETRY_DISABLED" > "$env_file"
          docker run --detach --name "$container_name" --publish 3000:3000 --env-file "$env_file" --volume "$volume_name:/data" deploy-svc:ci >/tmp/deploy-svc-container-id
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
            rm -f "$env_file" /tmp/deploy-svc-container-id
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live >/tmp/deploy-svc-container-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/deploy-svc-container-health.json
          grep -q '"status":"ok"' /tmp/deploy-svc-container-health.json
          curl --fail --silent http://127.0.0.1:3000/api/health/ready >/tmp/deploy-svc-container-ready.json
          grep -q '"status":"ready"' /tmp/deploy-svc-container-ready.json

